[workspace]
resolver = "2"
members = [
    "crates/una-core",
    "crates/una-platform",
    "crates/una-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/justin06lee/una"

[profile.release]
lto = true
codegen-units = 1
strip = true
