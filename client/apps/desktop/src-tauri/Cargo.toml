[package]
name = "una-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
una-core = { version = "0.1.0", path = "../../../crates/una-core" }
una-platform = { version = "0.1.0", path = "../../../crates/una-platform" }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
