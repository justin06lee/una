<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- una app icon: Una's hair bow as a waveform. Seven bars: a knot in the
       middle and three a side growing outward, tops rising faster than
       bottoms so the wings tip up like her ribbons. Black on white, as her
       bows are. Source of truth for every PNG/ICNS in this directory;
       regenerate them with `make icons` from client/. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ececec"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000000" filter="url(#drop)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  <g fill="#111111">
    <rect x="468.8" y="484.6" width="86.4" height="136.8" rx="43.2"/>
    <rect x="382.4" y="486.4" width="59.4" height="126" rx="29.7"/>
    <rect x="296" y="407.2" width="59.4" height="243" rx="29.7"/>
    <rect x="209.6" y="328" width="59.4" height="360" rx="29.7"/>
    <rect x="582.2" y="486.4" width="59.4" height="126" rx="29.7"/>
    <rect x="668.6" y="407.2" width="59.4" height="243" rx="29.7"/>
    <rect x="755" y="328" width="59.4" height="360" rx="29.7"/>
  </g>
</svg>
