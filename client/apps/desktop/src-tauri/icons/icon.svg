<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- una app icon: Una's hair bow drawn as a waveform. A knot in the middle,
       wings of bars that grow outward, tops rising faster than bottoms so the
       wings tip up like her ribbons. Black on white, as her bows are.
       Source of truth for every PNG/ICNS in this directory; regenerate them
       with `make icons` from client/. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ececec"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000000" filter="url(#drop)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  <g fill="#111111">
    <rect x="467.3" y="478.9" width="89.4" height="144.5" rx="44.7"/>
    <rect x="419.1" y="501.3" width="34.4" height="94.6" rx="17.2"/>
    <rect x="371" y="449.1" width="34.4" height="172.7" rx="17.2"/>
    <rect x="322.8" y="407.3" width="34.4" height="235.3" rx="17.2"/>
    <rect x="274.6" y="368.6" width="34.4" height="293.3" rx="17.2"/>
    <rect x="226.5" y="331.9" width="34.4" height="348.3" rx="17.2"/>
    <rect x="570.5" y="501.3" width="34.4" height="94.6" rx="17.2"/>
    <rect x="618.6" y="449.1" width="34.4" height="172.7" rx="17.2"/>
    <rect x="666.8" y="407.3" width="34.4" height="235.3" rx="17.2"/>
    <rect x="715" y="368.6" width="34.4" height="293.3" rx="17.2"/>
    <rect x="763.1" y="331.9" width="34.4" height="348.3" rx="17.2"/>
  </g>
</svg>
