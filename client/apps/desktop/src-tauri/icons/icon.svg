<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- una app icon: Una's hair bow as a waveform. Five bars: a knot in the
       middle and two a side growing outward, tops rising faster than
       bottoms so the wings tip up like her ribbons. Flat black on white,
       as her bows are.

       Full bleed on purpose: macOS 26 cuts its own squircle out of an
       opaque square, but sets an icon with transparent margins (the old
       Big Sur template) on a grey plate. Source of truth for every
       PNG/ICNS in this directory; regenerate them with `make icons` from
       client/. -->
  <rect width="1024" height="1024" fill="#ffffff"/>
  <g fill="#000000">
    <rect x="153.6" y="290.91" width="97.75" height="442.18" rx="48.87"/>
    <rect x="300.22" y="393.31" width="97.75" height="304.87" rx="48.87"/>
    <rect x="446.84" y="488.73" width="130.33" height="174.55" rx="65.16"/>
    <rect x="626.04" y="393.31" width="97.75" height="304.87" rx="48.87"/>
    <rect x="772.65" y="290.91" width="97.75" height="442.18" rx="48.87"/>
  </g>
</svg>
