# una on an x86_64 PC with a 6 GB NVIDIA card (tenet: a GTX 1660 Ti).
# install.sh copies this to server/una.toml once; edit that copy, not this one.
# Everything not set here keeps the default in server/una.toml.example.

[server]
# SECURITY: no authentication. Keep it on your LAN or a private mesh.
bind = "0.0.0.0"
port = 8100
data_dir = "./data"

[asr]
model = "large-v3-turbo"
device = "cuda"
compute_type = "int8_float16"   # ~0.9 GB of weights instead of 1.6, so a 3B fits beside it
language = "en"

[cleanup]
model = "llama3.2:3b"           # the base the style trainer puts your adapter on; ~2.7 GB
timeout_s = 3.0
timeout_per_word_s = 0.03       # long dictations get longer; a 1-minute one gets ~7 s

[training]
pause_serving = true            # Whisper and the cleanup model step aside while a run trains
batch_size = 2                  # with grad_accum, the same 16 clips a step as the defaults
grad_accum = 8
