[project]
name = "una-server"
version = "0.1.0"
description = "Self-hosted dictation server: faster-whisper ASR, Ollama cleanup, and on-device Whisper fine-tuning"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "faster-whisper>=1.1",
    "soundfile>=0.12",
    "soxr>=0.5",
    "zeroconf>=0.136",
    "jiwer>=3.0",
    "rapidfuzz>=3.10",
    "python-ulid>=2.7",
]

[project.optional-dependencies]
# bare-metal GPU serving: ctranslate2 links against cuBLAS/cuDNN for CUDA 12,
# which torch's cu13 wheels no longer provide (Docker's cudnn-runtime image has them)
cuda12 = [
    "nvidia-cublas-cu12; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'linux'",
]
training = [
    "torch>=2.4",
    "transformers>=4.46",
    "peft>=0.13",
    "datasets>=3.0",
    "accelerate>=1.0",
    "ctranslate2>=4.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/una_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
