<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='0.5' y='0.5' width='31' height='31' rx='8' fill='%23fff' stroke='%23dcdcdc'/%3E%3Cg fill='%23111' transform='translate(16 16) scale(.8) translate(-16 -15.6)'%3E%3Crect x='13.9' y='15.2' width='4.2' height='6' rx='2.1'/%3E%3Crect x='10.95' y='15.4' width='2.2' height='5.3' rx='1.1'/%3E%3Crect x='8' y='12.4' width='2.2' height='9.67' rx='1.1'/%3E%3Crect x='5.05' y='9.4' width='2.2' height='14.03' rx='1.1'/%3E%3Crect x='2.1' y='6.4' width='2.2' height='18.4' rx='1.1'/%3E%3Crect x='18.85' y='15.4' width='2.2' height='5.3' rx='1.1'/%3E%3Crect x='21.8' y='12.4' width='2.2' height='9.67' rx='1.1'/%3E%3Crect x='24.75' y='9.4' width='2.2' height='14.03' rx='1.1'/%3E%3Crect x='27.7' y='6.4' width='2.2' height='18.4' rx='1.1'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>una</title>
    <script>
      // Resolve the theme before first paint so the page never flashes the
      // wrong background. The theme store takes over once the app mounts.
      (() => {
        try {
          const saved = localStorage.getItem('una:theme');
          const dark =
            saved === 'dark' ||
            ((saved === 'system' || saved === null) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
