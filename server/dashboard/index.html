<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='0.5' y='0.5' width='31' height='31' rx='8' fill='%23fff' stroke='%23dcdcdc'/%3E%3Cg fill='%23111'%3E%3Crect x='14.43' y='15.15' width='3.14' height='4.98' rx='1.57'/%3E%3Crect x='11.29' y='15.21' width='2.16' height='4.58' rx='1.08'/%3E%3Crect x='8.14' y='12.33' width='2.16' height='8.84' rx='1.08'/%3E%3Crect x='5' y='9.45' width='2.16' height='13.1' rx='1.08'/%3E%3Crect x='18.55' y='15.21' width='2.16' height='4.58' rx='1.08'/%3E%3Crect x='21.7' y='12.33' width='2.16' height='8.84' rx='1.08'/%3E%3Crect x='24.84' y='9.45' width='2.16' height='13.1' rx='1.08'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>una</title>
    <script>
      // Resolve the theme before first paint so the page never flashes the
      // wrong background. The theme store takes over once the app mounts.
      (() => {
        try {
          const saved = localStorage.getItem('una:theme');
          const dark =
            saved === 'dark' ||
            ((saved === 'system' || saved === null) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
