<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='0.5' y='0.5' width='31' height='31' rx='8' fill='%23fff' stroke='%23dcdcdc'/%3E%3Cg fill='%23000'%3E%3Crect x='5' y='9.21' width='3' height='13.57' rx='1.5'/%3E%3Crect x='9.5' y='12.36' width='3' height='9.36' rx='1.5'/%3E%3Crect x='14' y='15.29' width='4' height='5.36' rx='2'/%3E%3Crect x='19.5' y='12.36' width='3' height='9.36' rx='1.5'/%3E%3Crect x='24' y='9.21' width='3' height='13.57' rx='1.5'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>una</title>
    <script>
      // Resolve the theme before first paint so the page never flashes the
      // wrong background. The theme store takes over once the app mounts.
      (() => {
        try {
          const saved = localStorage.getItem('una:theme');
          const dark =
            saved === 'dark' ||
            ((saved === 'system' || saved === null) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
